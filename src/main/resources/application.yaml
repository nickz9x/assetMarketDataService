
spring:
  application:
    name: assetMarketDataService
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ChainTracker
  datasource:
    url: jdbc:postgresql://assetData-service-db:5432/assetDataService
    username: user
    password: postgres
  data:
    redis:
      password: admin
      host: my-redis
      port: 6379
      type: redis
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
