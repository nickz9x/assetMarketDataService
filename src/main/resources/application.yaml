
spring:
  application:
    name: assetMarketDataService
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak roda em localhost:8081. A porta 8080 e a porta INTERNA
          # do container (mapeamento 8081:8080), nao a porta de acesso.
          # O issuer-uri dispara o discovery em
          # /.well-known/openid-configuration, que devolve o jwk-set-uri e
          # faz o Spring validar a claim "iss" automaticamente.
          issuer-uri: http://keycloak:8080/realms/ChainTracker
  datasource:
    url: jdbc:postgresql://assetData-service-db:5432/assetDataService
    username: user
    password: postgres
  data:
    redis:
      password: admin
      host: my-redis
      port: 6379
      type: redis
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  flyway:
    # Bancos que ja rodaram com ddl-auto: update tem as tabelas criadas pelo
    # Hibernate e nenhum historico do Flyway. O baseline no 0 registra esse
    # estado sem pular a V1 (as migracoes usam IF NOT EXISTS).
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    hibernate:
      # O schema e do Flyway (db/migration); o Hibernate so confere se as
      # entidades batem com ele.
      ddl-auto: validate
alchemy:
  api-key: "key"
  url: "url"
coingecko:
  url: "https://api.coingecko.com/api/v3/"
  api-key: ${COINGECKO_KEY}
alpaca:
  trading-url: "https://paper-api.alpaca.markets/v2/"
  url: "https://data.alpaca.markets/v2/"
  api-key: ${ALPACA_KEY}
  api-secret: ${ALPACA_SECRET}
server:
  port: 8082
