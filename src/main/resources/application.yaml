
spring:
  application:
    name: assetMarketDataService
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak roda em localhost:8081. A porta 8080 e a porta INTERNA
          # do container (mapeamento 8081:8080), nao a porta de acesso.
          # O issuer-uri dispara o discovery em
          # /.well-known/openid-configuration, que devolve o jwk-set-uri e
          # faz o Spring validar a claim "iss" automaticamente.
          issuer-uri: http://localhost:8081/realms/ChainTracker
  datasource:
    url: jdbc:postgresql://localhost:5433/assetDataService
    username: user
    password: postgres
  data:
    redis:
      password: admin
      host: localhost
      port: 6379
      type: redis
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
